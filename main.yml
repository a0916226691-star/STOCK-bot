name: 台股每日題材與法人雷達

on:
  schedule:
    # 台灣時間週一到週五 19:00
    # GitHub Actions cron 使用 UTC，所以台灣 19:00 = UTC 11:00
    - cron: "0 11 * * 1-5"

  # 讓你可以在 GitHub Actions 手動測試
  workflow_dispatch:

# 允許 GitHub Actions 把 output/*.csv commit 回 repo
permissions:
  contents: write

jobs:
  run-stock-radar:
    runs-on: ubuntu-latest

    steps:
      # 1. 下載 repo 原始碼與過去已儲存的 CSV 歷史
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. 安裝 Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. 安裝 main.py 需要的套件
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests lxml html5lib beautifulsoup4

      # 4. 確保 output 資料夾存在
      - name: Create output directory
        run: |
          mkdir -p output

      # 5. 執行你的 Python 主程式
      - name: Run stock radar
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          python main.py

      # 6. 把實際產生的內容列在 Actions log
      - name: Check generated CSV files
        if: always()
        run: |
          echo "===== Repository files ====="
          ls -lah

          echo "===== output directory ====="
          ls -lah output || true

          echo "===== CSV files ====="
          find output -maxdepth 1 -type f -name "*.csv" -print || true

      # 7. 將 output 裡的 CSV commit 回 GitHub repo
      - name: Save CSV history to repository
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/

          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "chore: save radar data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin HEAD:${{ github.ref_name }}
          fi

      # 8. 額外存一份 Artifact，方便失敗時下載檢查
      - name: Upload output backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-radar-output-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
