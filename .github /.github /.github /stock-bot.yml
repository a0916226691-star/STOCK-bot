# -*- coding: utf-8 -*-

import os
import smtplib
import traceback
from datetime import datetime, timedelta, timezone
from email.mime.multipart import MIMEMultipart
from email.mime.text import MIMEText

import pandas as pd
import requests


TZ = timezone(timedelta(hours=8))
TODAY = datetime.now(TZ).strftime("%Y-%m-%d")

OUTPUT_DIR = "output"
os.makedirs(OUTPUT_DIR, exist_ok=True)

CSV_FILE = os.path.join(OUTPUT_DIR, f"daily_theme_candidates_{TODAY}.csv")

GMAIL_USER = os.getenv("GMAIL_USER")
GMAIL_APP_PASSWORD = os.getenv("GMAIL_APP_PASSWORD")
RECIPIENT_EMAIL = os.getenv("RECIPIENT_EMAIL")

HEADERS = {
    "User-Agent": "Mozilla/5.0"
}

# 你可以之後自行補股票代號
THEMES = {
    "AI 伺服器": ["2317", "2382", "3231", "6669"],
    "散熱": ["3017", "3324", "6205"],
    "PCB／CCL": ["2368", "2385", "3037", "4967"],
    "電源管理": ["2308", "6504", "3533"],
    "光通訊／矽光子": ["3081", "3163", "6443", "4989"],
    "先進封裝": ["2330", "3711", "3131", "3374"],
}


def to_number(value):
    try:
        text = str(value).replace(",", "").replace("%", "").strip()
        if text in ["", "-", "--", "nan", "None"]:
            return None
        return float(text)
    except Exception:
        return None


def get_twse_quotes():
    """
    取得 TWSE 上市股票當日收盤資料。
    """
    today_api = datetime.now(TZ).strftime("%Y%m%d")

    url = "https://www.twse.com.tw/exchangeReport/MI_INDEX"
    params = {
        "response": "json",
        "date": today_api,
        "type": "ALL",
    }

    response = requests.get(url, params=params, headers=HEADERS, timeout=30)
    response.raise_for_status()
    data = response.json()

    if data.get("stat") != "OK":
        raise RuntimeError(f"TWSE 資料取得失敗：{data.get('stat')}")

    table = None
    for item in data.get("tables", []):
        title = item.get("title", "")
        if "每日收盤行情" in title and "ETF" not in title:
            table = item
            break

    if table is None:
        raise RuntimeError("找不到 TWSE 每日收盤行情表")

    fields = table["fields"]
    rows = table["data"]

    results = []

    for row in rows:
        item = dict(zip(fields, row))
        stock_id = str(item.get("證券代號", "")).strip()

        if not stock_id.isdigit():
            continue

        results.append({
            "stock_id": stock_id,
            "stock_name": str(item.get("證券名稱", "")).strip(),
            "close": to_number(item.get("收盤價")),
            "change": to_number(item.get("漲跌價差")),
            "volume": to_number(item.get("成交股數")),
            "turnover": to_number(item.get("成交金額")),
        })

    return pd.DataFrame(results)


def make_theme_table(quotes):
    """
    將題材池股票與收盤資料合併。
    """
    rows = []

    for theme, stock_ids in THEMES.items():
        for stock_id in stock_ids:
            result = quotes[quotes["stock_id"] == stock_id]

            if result.empty:
                continue

            stock = result.iloc[0].to_dict()
            stock["theme"] = theme
            rows.append(stock)

    if not rows:
        return pd.DataFrame(columns=[
            "theme", "stock_id", "stock_name",
            "close", "change", "volume", "turnover"
        ])

    df = pd.DataFrame(rows)

    return df[[
        "theme", "stock_id", "stock_name",
        "close", "change", "volume", "turnover"
    ]].sort_values(
        by=["theme", "turnover"],
        ascending=[True, False]
    )


def format_money(value):
    if pd.isna(value):
        return "-"

    value = float(value)

    if abs(value) >= 100_000_000:
        return f"{value / 100_000_000:.2f} 億"

    if abs(value) >= 1_000_000:
        return f"{value / 1_000_000:.2f} 百萬"

    return f"{value:,.0f}"


def format_price(value):
    if pd.isna(value):
        return "-"

    return f"{float(value):.2f}"


def make_email_text(df):
    """
    建立 Email 內容。
    """
    lines = [
        f"台股每日題材雷達",
        f"日期：{TODAY}",
        "",
        "【今日題材池收盤資料】",
        "",
    ]

    if df.empty:
        lines.append("今日未取得題材池股票資料。")
    else:
        current_theme = None

        for _, row in df.iterrows():
            if row["theme"] != current_theme:
                current_theme = row["theme"]
                lines.append("")
                lines.append(f"■ {current_theme}")

            change = row["change"]
            change_text = "-" if pd.isna(change) else f"{float(change):+.2f}"

            lines.append(
                f"{row['stock_id']} {row['stock_name']}｜"
                f"收盤 {format_price(row['close'])}｜"
                f"漲跌 {change_text}｜"
                f"成交額 {format_money(row['turnover'])}"
            )

    lines.extend([
        "",
        "",
        "提醒：本內容為資料整理與研究輔助，不構成投資建議。",
    ])

    return "\n".join(lines)


def send_email(subject, body):
    """
    用 Gmail SMTP 寄出 Email。
    """
    if not all([GMAIL_USER, GMAIL_APP_PASSWORD, RECIPIENT_EMAIL]):
        print("找不到 Gmail Secrets，略過寄信。")
        return

    message = MIMEMultipart()
    message["From"] = GMAIL_USER
    message["To"] = RECIPIENT_EMAIL
    message["Subject"] = subject
    message.attach(MIMEText(body, "plain", "utf-8"))

    with smtplib.SMTP_SSL("smtp.gmail.com", 465) as server:
        server.login(GMAIL_USER, GMAIL_APP_PASSWORD)
        server.send_message(message)


def main():
    print("開始抓取 TWSE 每日收盤資料...")

    quotes = get_twse_quotes()

    print(f"取得 {len(quotes)} 筆上市股票資料。")

    theme_df = make_theme_table(quotes)

    theme_df.to_csv(CSV_FILE, index=False, encoding="utf-8-sig")

    print(f"CSV 已建立：{CSV_FILE}")

    email_body = make_email_text(theme_df)

    send_email(
        subject=f"台股每日題材雷達 {TODAY}",
        body=email_body
    )

    print("流程完成。")


if __name__ == "__main__":
    try:
        main()
    except Exception:
        error_message = traceback.format_exc()
        print(error_message)

        try:
            send_email(
                subject=f"【錯誤】台股每日題材雷達 {TODAY}",
                body=error_message
            )
        except Exception:
            pass

        raise
