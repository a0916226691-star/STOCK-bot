name: Long-term Growth Radar

on:
  workflow_dispatch:
    inputs:
      backfill:
        description: "回補月營收、財報（第一次填 1）；平常留空"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  longterm:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests lxml html5lib

      - name: Run long-term radar
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          BACKFILL: ${{ github.event.inputs.backfill }}
        run: |
          mkdir -p output
          if [ "$BACKFILL" = "probe" ]; then
            python 長線.py --probe
          elif [ -n "$BACKFILL" ]; then
            python 長線.py --backfill
          else
            python 長線.py
          fi

      - name: Save data to GitHub
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189282+github-actions[bot]@users.noreply.github.com"
          git add output/longterm.db output/lt_probe.txt 2>/dev/null || true
          git add -A output/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Save long-term data"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi
