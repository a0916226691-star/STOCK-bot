name: Probe3
on:
  push:
    branches: [probe3]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        mode: [fund, margin]
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests && python tools/f_fetch.py
        env:
          MODE: ${{ matrix.mode }}
      - if: always()
        run: |
          git config user.name bot && git config user.email bot@x
          git add -f output/${{ matrix.mode }}.csv && git commit -m "${{ matrix.mode }} data" && for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep 15; done
