name: Holdings Revenue Watch

on:
  schedule:
    - cron: "47 12 * * *"   # 台灣時間每天晚上 20:47：先收今天收盤資料，再檢查持股四條警示＋大跌加碼收盤確認＋法說會公告，觸發當晚寄信
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests lxml html5lib beautifulsoup4
      - name: Check holdings revenue
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python 長線.py --hold-watch
      - name: Save data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189282+github-actions[bot]@users.noreply.github.com"
          git add output/longterm.db output/tw_radar.db output/dip_state.json
          if git diff --cached --quiet; then echo "No changes."; else
            git commit -m "Save holdings watch"
            for i in 1 2 3; do git pull --rebase -X theirs origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break; git rebase --abort 2>/dev/null; sleep 10; done
          fi
