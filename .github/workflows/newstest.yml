name: News test
on:
  push:
    branches: [newstest]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests && mkdir -p output && python newstest.py
      - run: |
          git config user.name bot && git config user.email bot@x
          git add -f output/newstest.json && git commit -m "news test result" && git push
