name: Holdings Valuation Weekly

on:
  schedule:
    - cron: "37 6 * * 6"   # 台灣時間每週六下午 14:37：持股估值週報（三情境、法人目標價、升降評與新聞原因）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  valuation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests lxml html5lib beautifulsoup4
      - name: Valuation report
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python 長線.py --valuation
      - name: Save data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189282+github-actions[bot]@users.noreply.github.com"
          git add output/longterm.db
          if git diff --cached --quiet; then echo "No changes."; else
            git commit -m "Save valuation data"
            for i in 1 2 3; do git pull --rebase -X theirs origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break; git rebase --abort 2>/dev/null; sleep 10; done
          fi
