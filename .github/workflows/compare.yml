name: Compare fetch
on:
  push:
    branches: [compare]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests && mkdir -p output && python cmp_fetch.py
      - run: |
          git config user.name bot && git config user.email bot@x
          git add -f output/compare.json && git commit -m "compare data" && git push
